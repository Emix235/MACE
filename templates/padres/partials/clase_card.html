<div class="card mb-2 calendar-event event-expandible clase-card">
    <div class="card-body p-2">
        <h6 class="card-title mb-1">{{ horario.clase.nombre }}</h6>
        <p class="card-text mb-1 small">
            {{ horario.hora_inicio|time:"H:i" }} - {{ horario.hora_fin|time:"H:i" }}
        </p>
        <p class="card-text small text-muted mb-0">
            Prof: {{ horario.clase.profesor.nombre_completo }}
        </p>
        <p class="card-text small text-muted">
            Aula: {{ horario.aula }}
        </p>
    </div>
</div>
