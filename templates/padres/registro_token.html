{% extends 'padres/base.html' %}

{% block content %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">
                            <i class="fas fa-user-plus"></i> Registro para padre de {{ estudiante.nombre_completo }}
                        </h3>
                        <!-- padres/registro.html -->
                        {% if estudiante %}
                            <div class="alert alert-info">
                                Está registrando al padre/tutor de: <strong>{{ estudiante.nombre_completo }}</strong>
                            </div>
                        {% endif %}

                    </div>
                    <div class="card-body">
                        <form method="post" enctype="multipart/form-data">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-lg">
                                    <i class="fas fa-save"></i> Registrar y Vincular
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
