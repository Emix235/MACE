<!DOCTYPE html>
<html>
<body>
    <div style="max-width: 600px; margin: 0 auto; font-family: Arial, sans-serif;">
        <div style="background-color: #f8f9fa; padding: 20px; text-align: center; border-radius: 10px 10px 0 0;">
            <h2 style="color: #3a7bd5; margin: 0;">Invitación de Registro</h2>
        </div>
        
        <div style="padding: 20px; background: white; border-radius: 0 0 10px 10px; border: 1px solid #eee;">
            <p style="font-size: 16px;">Estimado padre/tutor de <strong>{{ estudiante.nombre_completo }}</strong>,</p>
            
            <div style="text-align: center; margin: 25px 0;">
                <div style="background-color: #f8f9fa; padding: 20px; border-radius: 10px; display: inline-block;">
                    <p style="margin: 0;">Haga clic en el botón para completar su registro:</p>
                    
                    <!-- Botón que redirige sin mostrar el enlace -->
                    <a href="{{ enlace_registro }}" 
                       style="display: inline-block; margin-top: 15px; padding: 12px 24px; 
                              background-color: #3a7bd5; color: white; text-decoration: none; 
                              border-radius: 5px; font-weight: bold;">
                        Registrar como Padre
                    </a>
                </div>
            </div>
            
            <p style="font-size: 14px; color: #666; text-align: center;">
                Esta invitación es personal e intransferible.
            </p>
        </div>
    </div>
</body>
</html>
