{% extends 'servicios_escolares/base.html' %}

{% load static %}

{% block content %}
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-0" style="border-radius: 1rem;">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <h4 class="mb-3" style="color: var(--primary-color);">Configuración</h4>
                        </div>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item bg-transparent px-0 py-3" style="border-bottom: 1px solid rgba(0,0,0,0.06);">
                                <a class="d-flex align-items-center text-decoration-none" href="#" style="gap: 0.75rem;">
                                    <i class="bi bi-gear-fill" style="font-size: 1.1rem; opacity: 0.8;"></i>
                                    <span class="fw-bold">Ajustes Generales</span>
                                </a>
                            </li>
                            <li class="list-group-item bg-transparent px-0 py-3" style="border-bottom: 1px solid rgba(0,0,0,0.06);">
                                <a class="d-flex align-items-center text-decoration-none" href="{% url 'servicios_escolares:panel_notificaciones' %}" style="gap: 0.75rem;">
                                    <i class="bi bi-bell-fill" style="font-size: 1.1rem; opacity: 0.8;"></i>
                                    <span class="fw-bold">Notificaciones</span>
                                </a>
                            </li>
                            <li class="list-group-item bg-transparent px-0 py-3" style="border-bottom: 1px solid rgba(0,0,0,0.06);">
                                <a class="d-flex align-items-center text-decoration-none" href="{% url 'servicios_escolares:todos_tickets' %}" style="gap: 0.75rem;">
                                    <i class="bi bi-chat-dots-fill" style="font-size: 1.1rem; opacity: 0.8;"></i>
                                    <span class="fw-bold">Tickets de Soporte</span>
                                </a>
                            </li>
                            <li class="list-group-item bg-transparent px-0 py-3">
                                <a class="d-flex align-items-center text-decoration-none" href="{% url 'servicios_escolares:theme_settings' %}" style="gap: 0.75rem;">
                                    <i class="bi bi-palette-fill" style="font-size: 1.1rem; opacity: 0.8;"></i>
                                    <span class="fw-bold">Cambiar Tema Global</span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <style>
        .list-group-item {
            transition: all 0.2s ease;
        }
        
        .list-group-item:hover {
            padding-left: 0.5rem !important;
        }
        
        .list-group-item a:hover span {
            text-decoration: none;
            text-underline-offset: 3px;
        }
        
        .card {
            transition: box-shadow 0.2s ease;
        }
        
        .card:hover {
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.08) !important;
        }
    </style>
{% endblock %}
